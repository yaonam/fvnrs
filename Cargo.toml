[workspace]
resolver = "2"
members  = ["engine_core", "state", "ui", "script", "utils"]

[workspace.dependencies]
# External
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = [
    "clock",
    "std",
] }
# Shared, non-platform specific eframe features
eframe = { version = "0.34.1", default-features = false, features = [
    "wgpu",
    "default_fonts",
] }
emath = "0.34.1"
glam = "0.32.1"
image = { version = "0.25.10", features = ["png", "webp"] }
log = "0.4.25"
parking_lot = "0.12.5"
rodio = { version = "0.22.2", default-features = false, features = [
    "playback",
    "vorbis",
    "mp3",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

# Internal
engine_core = { path = "engine_core" }
script      = { path = "script" }
state       = { path = "state" }
ui          = { path = "ui" }
